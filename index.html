<title>OVA · Capa de Internet TCP/IP</title>
<style>
:root{--bg:#f6f8fb;--fg:#17202e;--card:#fff;--ac:#1f6feb;--ok:#1a7f37;--ko:#cf222e;--bd:#d6dde8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--fg:#e6ebf4;--card:#171f2e;--ac:#5aa2ff;--ok:#3fb950;--ko:#ff7b72;--bd:#2c3a52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--fg:#e6ebf4;--card:#171f2e;--ac:#5aa2ff;--ok:#3fb950;--ko:#ff7b72;--bd:#2c3a52;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,Segoe UI,Arial,sans-serif}
header{background:var(--ac);color:#fff;padding:18px 16px}header h1{margin:0;font-size:1.3rem}header p{margin:4px 0 0;opacity:.9;font-size:.9rem}
nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button,.btn{border:1px solid var(--bd);background:var(--bg);color:var(--fg);padding:7px 11px;border-radius:8px;cursor:pointer;font:inherit;font-size:.88rem}
nav button.on,.btn{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:12px 0}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:8px 0;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.ko{background:var(--ko);color:#fff;border-color:var(--ko)}
.fb{font-size:.9rem;margin:6px 0 0}.res{font-weight:700;font-size:1.05rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid var(--bd);padding:6px 8px;text-align:left}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-block;background:var(--bd);border-radius:20px;padding:2px 10px;font-size:.8rem}
code{background:var(--bd);padding:1px 5px;border-radius:4px}
.path{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}.node{border:2px solid var(--ac);border-radius:8px;padding:4px 10px}.node.hit{background:var(--ac);color:#fff}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:24px 0 8px;padding-top:14px;border-top:1px solid var(--bd)}.pager span{font-size:.85rem;opacity:.75;text-align:center}.pager .btn:disabled{opacity:.35;cursor:default}
body{font-family:'Nunito',system-ui,sans-serif}h1,h2,h3,summary,.res{font-family:'Poppins','Nunito',system-ui,sans-serif}
header{background:linear-gradient(135deg,#1f6feb,#7c3aed 60%,#ec4899);padding:26px 18px;text-align:center;box-shadow:0 4px 18px #0003}header h1{font-size:1.6rem}
nav{justify-content:center;box-shadow:0 2px 10px #0002}nav button{border-radius:20px;transition:.15s}nav button:hover{transform:translateY(-2px);border-color:var(--ac)}nav button.on{background:linear-gradient(135deg,#1f6feb,#7c3aed);border-color:transparent;box-shadow:0 3px 10px #7c3aed55}
.btn{border-radius:22px;background:linear-gradient(135deg,#1f6feb,#7c3aed);border:0;padding:9px 18px;font-weight:700;box-shadow:0 3px 10px #1f6feb44;transition:.15s}.btn:hover:not(:disabled){transform:translateY(-2px)}
.card,details{border-radius:16px;box-shadow:0 4px 14px #0000000f}details[open]{border-color:var(--ac)}summary::before{content:"💡 "}
.opt{border-radius:12px;transition:.15s}.opt:hover:not(.ok):not(.ko){border-color:var(--ac);transform:translateX(4px)}
main>*,main>div>*{animation:up .4s both}@keyframes up{from{opacity:0;transform:translateY(10px)}}
.hero{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#1f6feb22,#ec489922);border:1px solid var(--bd);border-radius:18px;padding:14px 18px;margin-bottom:8px}.hero>span{font-size:2.4rem}.hero h2{margin:0}.hero small{opacity:.7}
.inp{width:100%;padding:11px 14px;margin:8px 0;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--fg);font:inherit}.inp:focus{outline:0;border-color:var(--ac)}
.score{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;margin:8px auto}.score div{width:100px;height:100px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:700 1.7rem Poppins,sans-serif}
.bar{display:block;height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#7c3aed)}.big{text-align:center;font-size:1.25rem;font-weight:700}
.fig{margin:12px 0;text-align:center}.fig img{max-width:100%;border-radius:14px;box-shadow:0 4px 14px #0003}.fig figcaption{font-size:.85rem;opacity:.75;margin-top:6px}.logo{height:72px;background:#fff;border-radius:14px;padding:5px;margin-bottom:8px;box-shadow:0 2px 8px #0003}
:root{--bg:#fff6fd;--bg2:#e8f4ff;--fg:#1d1033;--card:#fff;--ac:#7b2ff7;--ac2:#f107a3;--ok:#00a862;--ko:#e11d48;--bd:#e9c9ff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150a26;--bg2:#0a1630;--fg:#f5ecff;--card:#22123d;--ac:#c084fc;--ac2:#ff5ccf;--ok:#2ee59d;--ko:#ff6b8a;--bd:#4a2a7a}}
:root[data-theme="dark"]{--bg:#150a26;--bg2:#0a1630;--fg:#f5ecff;--card:#22123d;--ac:#c084fc;--ac2:#ff5ccf;--ok:#2ee59d;--ko:#ff6b8a;--bd:#4a2a7a}
body{background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed}
header{background:linear-gradient(135deg,#7b2ff7,#f107a3 55%,#ff8a00)}
nav button.on,.btn{background:linear-gradient(135deg,#7b2ff7,#f107a3);box-shadow:0 4px 12px #f107a355}nav button.on{border-color:transparent}nav button:hover{border-color:var(--ac2)}
.hero{background:linear-gradient(135deg,#7b2ff733,#f107a333,#ff8a0033);border-color:var(--ac2)}
.card{border-top:4px solid var(--ac2)}details{border-left:5px solid var(--ac)}details[open]{border-color:var(--ac2)}summary{color:var(--ac)}h2,h3{color:var(--ac)}
.opt:hover:not(.ok):not(.ko){border-color:var(--ac2)}.opt.ok{background:var(--ok);color:#04210f}.opt.ko{background:var(--ko);color:#fff}
.bar i{background:linear-gradient(90deg,#00d4ff,#7b2ff7,#f107a3,#ffb800)}
.tag{background:linear-gradient(135deg,#ffd60a,#ff8a00);color:#2b1400;font-weight:700}code{background:#ffd60a66;color:inherit}
.node{border-color:var(--ac2)}.node.hit{background:var(--ac2);color:#fff}
.slide{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--ac2);border-radius:16px;padding:16px 18px;min-height:170px;animation:up .35s both}.dots{display:flex;gap:6px;align-items:center}.dots i{width:10px;height:10px;border-radius:50%;background:var(--bd)}.dots i.on{background:var(--ac2);transform:scale(1.4)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.tab{border:2px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}.tab.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
.stp{display:flex;justify-content:center;margin:10px 0}.sc{width:44px;height:44px;border-radius:50%;border:3px solid var(--bd);background:var(--card);color:var(--fg);font:700 1rem Poppins,sans-serif;cursor:pointer;margin:0 12px;position:relative;transition:.2s}.sc::after{content:"";position:absolute;left:100%;top:50%;width:24px;height:3px;background:var(--bd)}.sc:last-child::after{display:none}.sc.done{background:var(--ok);border-color:var(--ok);color:#04210f}.sc.on{background:var(--ac2);border-color:var(--ac2);color:#fff;transform:scale(1.18)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin:12px 0}.flip{perspective:1000px;cursor:pointer;height:270px}.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s}.flip.on .fi{transform:rotateY(180deg)}.ff,.fk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:16px;overflow:auto}.ff{background:linear-gradient(135deg,#7b2ff7,#f107a3 60%,#ff8a00);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}.ff span{font-size:2.6rem}.ff h3{color:#fff;margin:0}.fk{background:var(--card);border:2px solid var(--ac2);transform:rotateY(180deg);font-size:.95rem}
.pop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 12px;border-radius:18px;border:2px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;cursor:pointer;transition:.15s}.pop:hover{transform:translateY(-4px);border-color:var(--ac2);box-shadow:0 8px 20px #f107a333}.pop span{font-size:2.2rem}.pop small{opacity:.7}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px}.mb{background:var(--card);color:var(--fg);border-radius:18px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:16px;border-top:5px solid var(--ac2)}

za con lupa: ¡a resolver los retos!", "juegos": "Aprender jugando refuerza lo estudiado.", "fin": "Demuestra todo lo que aprendiste."};const im=k=>'<figure class="fig"><img src="'+IMG[k]+'" alt="'+CAP[k]+'"><figcaption>'+CAP[k]+'</figcaption></figure>';const UI=[['u1'],['u2'],['u3'],['u4'],['u5w'],['u6']];document.getElementById('lg').src=IMG.logo;
const U=[
{t:'Generalidades del nivel de red',g:[
['¿Qué hace la capa de Internet?','Lleva paquetes desde el host origen hasta el destino cruzando varias redes. Su protocolo central es IP, apoyado por ICMP y los protocolos de enrutamiento.'],
['Ubicación y relación con otras capas','Está sobre la capa de acceso a red y bajo la de transporte (TCP/UDP). Analogía: IP es el servicio postal entre ciudades; la capa de acceso es el camión que recorre las calles de cada ciudad.'],
['Direccionamiento lógico y encapsulación','Cada interfaz tiene una dirección IP (lógica, jerárquica; la MAC es física). Los datos bajan así: mensaje → <b>segmento</b> (transporte) → <b>paquete/datagrama</b> (Internet) → <b>trama</b> (acceso). Cada capa añade su encabezado.'],
['Reenvío vs. enrutamiento','<b>Reenvío</b> (plano de datos): mover un paquete de un puerto de entrada al de salida correcto; ocurre en nanosegundos. <b>Enrutamiento</b> (plano de control): calcular las rutas que llenan la tabla de reenvío. Analogía: reenviar es pasar por un cruce; enrutar es planear el viaje.']],
q:[['¿Cuál es la función principal de la capa de Internet?',['Entrega confiable de datos extremo a extremo','Llevar paquetes de un host origen a un destino a través de varias redes','Convertir bits en señales eléctricas','Cifrar la sesión de usuario'],1,'La confiabilidad es tarea de TCP (transporte); la capa de Internet entrega paquetes entre redes con IP.'],
['¿Cuál es la diferencia entre reenvío y enrutamiento?',['Reenvío mueve el paquete de entrada a salida; enrutamiento calcula las rutas','Son sinónimos','Enrutamiento ocurre por paquete y reenvío una vez al día','Reenvío solo existe en switches'],0,'El reenvío es el plano de datos (rápido, por paquete); el enrutamiento es el plano de control.'],
['¿Cómo se llama la PDU de la capa de Internet?',['Trama','Segmento','Paquete o datagrama','Bit'],2,'Trama = enlace, segmento = transporte, paquete/datagrama = Internet.'],
['¿Qué tipo de dirección usa IP?',['Física (MAC)','Lógica y jerárquica','Un puerto','Un nombre DNS'],1,'La IP es lógica: su prefijo identifica la red, lo que permite agregar rutas.'],
['En la encapsulación, el segmento TCP viaja…',['Dentro de un paquete IP, que va dentro de una trama','Dentro de una trama que contiene a IP y luego TCP','Sin encabezados adicionales','Dentro de un mensaje ICMP'],0,'Cada capa inferior encapsula la PDU de la superior: segmento → paquete → trama.']]},
{t:'Redes de circuitos virtuales y datagramas',g:[
['Redes de datagramas','Sin conexión: cada paquete lleva la IP destino y cada router decide por sí mismo. Paquetes del mismo flujo pueden seguir rutas distintas y llegar desordenados. Es el modelo de Internet (servicio de mejor esfuerzo).'],
['Redes de circuitos virtuales','Se establece una ruta antes de enviar datos (señalización). Cada paquete lleva un número de circuito virtual (VC) y los routers guardan estado por conexión. Ejemplos: ATM, Frame Relay.'],
['Comparación',null,'<table><tr><th></th><th>Datagramas</th><th>Circuitos virtuales</th></tr><tr><td>Establecimiento</td><td>No</td><td>Sí</td></tr><tr><td>Identificador</td><td>IP destino</td><td>Número de VC</td></tr><tr><td>Estado en routers</td><td>No por conexión</td><td>Sí</td></tr><tr><td>Orden de llegada</td><td>No garantizado</td><td>Se conserva</td></tr><tr><td>QoS</td><td>Difícil</td><td>Más predecible</td></tr></table>'],
['Recorrido de paquetes','Origen A → R1 → destino B. En datagramas, el paquete 1 puede ir por R2 y el paquete 2 por R3. En circuitos virtuales, todos van por la ruta fijada al establecer el VC (por ejemplo, R1 → R2 → B).']],
q:[['En una red de datagramas, ¿cómo se reenvía cada paquete?',['Según un número de VC','Según la IP destino, sin establecer conexión previa','Siguiendo siempre la misma ruta','Con reserva previa de recursos'],1,'Cada router consulta su tabla con la IP destino de cada paquete.'],
['¿Qué caracteriza a un circuito virtual?',['Ruta establecida antes de enviar y número de VC','Ausencia de estado en routers','Uso exclusivo de IP destino','Es el modelo de Internet'],0,'Los VC requieren señalización y estado por conexión.'],
['¿Qué modelo usa Internet?',['Circuitos virtuales','Datagramas (mejor esfuerzo)','Conmutación de circuitos físicos','Ninguno'],1,'IP es un servicio de datagramas de mejor esfuerzo.'],
['Una ventaja de los circuitos virtuales es…',['Calidad de servicio más predecible','Más simples de operar','No requieren señalización','No guardan estado'],0,'Al reservar ruta y recursos se facilita garantizar QoS.'],
['Una limitación de los datagramas es que…',['Los paquetes pueden llegar desordenados o por rutas distintas','Exigen establecer conexión','Cada router guarda estado por flujo','No pueden escalar'],0,'No hay garantías de orden ni de ruta; TCP lo corrige en los extremos.']]},
{t:'Principios de procesamiento del router',g:[
['Funciones y arquitectura','Un router reenvía paquetes (plano de datos) y ejecuta protocolos de enrutamiento (plano de control). Arquitectura: <b>puertos de entrada</b> → <b>fabric de conmutación</b> → <b>puertos de salida</b>, más un procesador de enrutamiento.'],
['Tabla de reenvío','Asocia prefijos con puertos de salida. Se elige el registro con el <b>prefijo más largo</b> que coincide con la IP destino. Ejemplo: 10.1.2.77 coincide con 10.0.0.0/8 y con 10.1.2.0/24; gana /24.'],
['Colas y congestión','Si los paquetes llegan más rápido de lo que salen, esperan en colas (en entrada o salida). Si el búfer se llena, el paquete se descarta. Así se manifiesta la congestión.'],
['Ejemplo: procesar un paquete','1) Se recibe y se revisa el encabezado. 2) Se consulta la tabla de reenvío. 3) Se conmuta por el fabric. 4) Espera en la cola de salida. 5) Se transmite con TTL reducido en 1. (Ordena estos pasos en el juego 2.)']],
q:[['¿Qué función cumple el fabric de conmutación?',['Transfiere el paquete del puerto de entrada al de salida','Calcula rutas BGP','Asigna direcciones IP','Cifra el tráfico'],0,'Es el elemento que interconecta puertos de entrada y salida.'],
['¿Qué criterio usa la tabla de reenvío al haber varias coincidencias?',['La primera entrada','El prefijo más largo','La menor MAC','Al azar'],1,'Se aplica la coincidencia de prefijo más largo.'],
['Si la cola de salida está llena y llega otro paquete…',['Se descarta','Se duplica','Cambia su IP','Se envía igual'],0,'El desbordamiento del búfer causa pérdida de paquetes.'],
['El plano de datos del router se encarga de…',['Reenviar paquetes','Ejecutar OSPF','Configurar el administrador','Resolver DNS'],0,'El plano de control calcula rutas; el de datos reenvía.'],
['El campo que el router decrementa en cada salto es…',['TTL','Checksum de TCP','Puerto origen','MAC destino'],0,'TTL baja 1 por salto; al llegar a 0 el paquete se descarta.']]},
{t:'Protocolos de Internet: IPv4 e IPv6',g:[
['IPv4','Direcciones de 32 bits en notación decimal (192.168.1.10). Encabezado mínimo de 20 bytes: versión, IHL, longitud total, identificación/flags/desplazamiento (fragmentación), TTL, protocolo, checksum, IP origen e IP destino.'],
